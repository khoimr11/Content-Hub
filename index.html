<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EDE4">
<meta name="robots" content="noindex">
<title>Content Hub · Lignarc & Living Furniture</title>
<link rel="icon" href="assets/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="bg-blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<section id="login" class="login">
  <form class="glass login-card" id="loginForm" autocomplete="on">
    <div class="brand"><img src="assets/icon.svg" alt=""><div><b>Content Hub</b><span>Lignarc · Living Furniture</span></div></div>
    <h1>Đăng nhập</h1>
    <p class="sub">Dùng tài khoản của <b>Dashboard Global</b> (Lignarc) hoặc <b>Dashboard Local</b> (Living Furniture). Hub đọc trực tiếp số liệu tồn kho, CastleGate và KPI từ dashboard để COO giao việc.</p>
    <label>Tài khoản<input id="user" autocomplete="username" required></label>
    <label>Mật khẩu<input id="pass" type="password" autocomplete="current-password" required></label>
    <label class="chk"><input type="checkbox" id="remember" checked> Ghi nhớ trên thiết bị này</label>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn pri" id="loginBtn">Đăng nhập</button>
  </form>
</section>

<div id="app" hidden>
  <header class="top glass">
    <div class="brand"><img src="assets/icon.svg" alt=""><div><b>Content Hub</b><span id="stamp">—</span></div></div>
    <nav id="tabs" class="tabs" role="tablist"></nav>
    <div class="top-r">
      <div class="seg" id="chSeg"><button data-ch="all" aria-pressed="true">Tất cả</button><button data-ch="global">Global</button><button data-ch="local">Local</button></div>
      <button class="icon-btn" id="settingsBtn" title="Cài đặt">⚙︎</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabbar glass" id="tabbar"></nav>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="assets/app.js"></script>
</body>
</html>
